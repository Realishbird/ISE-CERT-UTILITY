<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · ISE Certificate Utility</title>
<link rel="icon" href="{{ url_for('static', filename='mark.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="auth">
<main class="auth-panel">
  <div class="wordmark">
    <img src="{{ url_for('static', filename='mark.svg') }}" alt="" width="26" height="26">
    <span>ISE Certificate Utility</span>
  </div>
  <h1>Sign in</h1>
  {% if error %}<div class="banner banner-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label class="field">
      <span class="field-label">Username</span>
      <input name="username" required autocomplete="username" autofocus maxlength="64">
    </label>
    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" name="password" required autocomplete="current-password" maxlength="256">
    </label>
    <button class="button button-primary button-block" type="submit">Sign in</button>
  </form>
  <p class="auth-note">Sessions end after 30 minutes of inactivity. To reset access, run <code>ise-cert-utility init --reset-password</code> on the server.</p>
</main>
</body>
</html>
