[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ise-cert-utility"
dynamic = ["version"]
description = "Automated Let's Encrypt certificates for Cisco ISE, validated through Cloudflare DNS."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "gunicorn>=22",
    "cryptography>=43",
    "certbot>=2.11",
    "certbot-dns-cloudflare>=2.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ise-cert-utility = "ise_cert_utility.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ise_cert_utility.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ise_cert_utility = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S603", "S607", "S101", "S105", "S310", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
